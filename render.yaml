# Render Blueprint — J.A.R.V.I.S. backend (ücretsiz plan)
# Render panelinde "New + → Blueprint" ile bu depoyu seçin; gizli değerleri panelden girin.
services:
  - type: web
    name: jarvis-server
    runtime: node
    plan: free
    region: frankfurt
    rootDir: jarvis/server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TZ
        value: Europe/Istanbul
      - key: CLAUDE_MODEL
        value: claude-sonnet-5-5
      - key: CLAUDE_EFFORT
        value: medium
      - key: DEFAULT_CITY
        value: İstanbul
      - key: JARVIS_APP_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
