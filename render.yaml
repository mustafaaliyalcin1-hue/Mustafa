# Render Blueprint — J.A.R.V.I.S. backend (ücretsiz plan)
# Render panelinde "New + → Blueprint" ile bu depoyu seçin; gizli değerleri panelden girin.
services:
  - type: web
    name: jarvis-server
    runtime: node
    plan: free
    region: frankfurt
    rootDir: jarvis/server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TZ
        value: Europe/Istanbul
      - key: CLAUDE_MODEL
        value: claude-sonnet-5-5
      - key: CLAUDE_EFFORT
        value: medium
      - key: DEFAULT_CITY
        value: İstanbul
      - key: JARVIS_APP_SECRET
        generateValue: true
      # Ücretsiz beyin: Google AI Studio anahtarı (aistudio.google.com → Get API key)
      - key: GEMINI_API_KEY
        sync: false
      # Diğer ücretsiz beyinler — biri kotayı doldurunca otomatik sıradakine geçilir
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      # Kendi bilgisayarındaki yerel model (Ollama) — tünel adresi + /v1
      - key: OLLAMA_URL
        sync: false
      - key: OLLAMA_MODEL
        value: qwen3:8b
      # İsteğe bağlı ücretli beyin (Claude). İkisi de varsa Gemini kullanılır; AI_PROVIDER=claude ile değiştirilir.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false

  # J.A.R.V.I.S. arayüzü — ücretsiz statik site (HTTPS: mikrofon/sesli komut için gerekli)
  - type: web
    name: jarvis-app
    runtime: static
    rootDir: jarvis/web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Arayüzün bağlanacağı sunucu (kullanıcı yalnızca uygulama anahtarını girer)
      - key: VITE_JARVIS_API_URL
        value: https://jarvis-server-hdfg.onrender.com
    headers:
      - path: /*
        name: Permissions-Policy
        value: microphone=(self), camera=(self)
