<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Konuşan Arkadaşım</title>
  <meta name="description" content="1. ve 2. sınıflar için yapay zekâ destekli Türkçe telaffuz pekiştirme uygulaması">
  <meta name="theme-color" content="#5b4bdb">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <button id="backBtn" class="icon-btn" aria-label="Geri" hidden>←</button>
    <a class="brand" href="#/home"><span id="avatar" aria-hidden="true">✨</span> <span id="brandName">Konuşan Arkadaşım</span></a>
    <div class="stars" aria-label="Yıldızlar">⭐ <span id="starCount">0</span></div>
    <button id="menuBtn" class="icon-btn" aria-label="Menü">☰</button>
  </header>

  <main id="app" tabindex="-1" aria-live="polite">
    <div class="boot">
      <div class="boot-owl" aria-hidden="true">✨</div>
      <p><b>Konuşan Arkadaşım hazırlanıyor…</b></p>
      <p class="boot-help">Bu yazı birkaç saniye sonra hâlâ duruyorsa, açtığınız ekran uygulamayı çalıştıramıyor
        (örneğin iPhone'un dosya önizlemesi). Uygulamayı bir internet adresinden <b>Safari</b> veya <b>Chrome</b> ile açın.</p>
    </div>
  </main>

  <div id="toast" class="toast" role="status" hidden></div>

  <noscript><p style="padding:16px">Bu uygulama için JavaScript gereklidir.</p></noscript>
  <script>
    // Uygulama açılamazsa ekran boş kalmasın: hatayı göster (ekran görüntüsüyle sebep bulunur).
    window.addEventListener("error", function (e) {
      var app = document.getElementById("app");
      if (!app || !app.querySelector(".boot")) return;
      var p = document.createElement("p");
      p.style.cssText = "color:#c43333;font-size:14px;padding:0 16px;word-break:break-word";
      p.textContent = "Hata: " + (e.message || "bilinmiyor") + (e.filename ? " (" + e.filename.split("/").pop() + ":" + e.lineno + ")" : "");
      app.appendChild(p);
    }, true);
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
