<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Konuşan Arkadaşım</title>
  <meta name="description" content="1. ve 2. sınıflar için Türkçe ve İngilizce telaffuz pekiştirme uygulaması">
  <meta name="theme-color" content="#4f46e5">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="fx-bg" aria-hidden="true"><i class="au a"></i><i class="au b"></i><i class="au c"></i><i class="sky"></i><i class="floor"></i><i class="meteor m1"></i><i class="meteor m2"></i><i class="beam"></i></div>
  <header class="topbar">
    <button id="backBtn" class="icon-btn" aria-label="Geri" hidden><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg></button>
    <a class="brand" href="#/home"><span id="avatar" aria-hidden="true">✨</span> <span id="brandName">Konuşan Arkadaşım</span></a>
    <div class="stars" aria-label="Yıldızlar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"/></svg> <span id="starCount">0</span></div>
    <button id="menuBtn" class="icon-btn" aria-label="Menü"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg></button>
  </header>

  <main id="app" tabindex="-1" aria-live="polite">
    <div class="boot">
      
      <p><b>Konuşan Arkadaşım hazırlanıyor…</b></p>
      <p class="boot-help">Bu yazı birkaç saniye sonra hâlâ duruyorsa, açtığınız ekran uygulamayı çalıştıramıyor
        (örneğin iPhone'un dosya önizlemesi). Uygulamayı bir internet adresinden <b>Safari</b> veya <b>Chrome</b> ile açın.</p>
    </div>
  </main>

  <div id="toast" class="toast" role="status" hidden></div>

  <noscript><p style="padding:16px">Bu uygulama için JavaScript gereklidir.</p></noscript>
  <script>
    // Uygulama açılamazsa ekran boş kalmasın: hatayı göster (ekran görüntüsüyle sebep bulunur).
    window.addEventListener("error", function (e) {
      var app = document.getElementById("app");
      if (!app || !app.querySelector(".boot")) return;
      var p = document.createElement("p");
      p.style.cssText = "color:#c43333;font-size:14px;padding:0 16px;word-break:break-word";
      p.textContent = "Hata: " + (e.message || "bilinmiyor") + (e.filename ? " (" + e.filename.split("/").pop() + ":" + e.lineno + ")" : "");
      app.appendChild(p);
    }, true);
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
