<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#111418">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Uzak Kumanda</title>
<style>
:root{--bg:#111418;--panel:#1b2027;--btn:#262c35;--btn2:#313945;--txt:#e9edf2;--soft:#93a0b0;--acc:#3b82f6;--red:#ef4444}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:var(--txt);background:var(--btn);border:0;border-radius:10px;padding:10px 6px;min-height:42px;cursor:pointer}
button:active{background:var(--btn2);transform:scale(.97)}
button.on{background:var(--acc)}
#giris{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:9}
#giris .kutu{width:min(320px,90vw);text-align:center}
#giris h1{font-size:22px;margin:0 0 6px}
#giris p{color:var(--soft);margin:0 0 18px}
#pin{width:100%;font-size:24px;letter-spacing:2px;text-align:center;padding:12px;border-radius:12px;border:1px solid #333b46;background:var(--panel);color:var(--txt)}
#giris button{width:100%;margin-top:12px;background:var(--acc);font-weight:600}
#hata{color:var(--red);min-height:20px;margin-top:8px}
header{display:flex;gap:6px;padding:8px 8px 6px;align-items:center}
header .sekme{flex:1}
#durum{width:10px;height:10px;border-radius:50%;background:var(--red);flex:none}
#durum.ok{background:#22c55e}
#alan{flex:1;position:relative;margin:0 8px;border-radius:12px;background:#000;overflow:hidden;touch-action:none}
#ekran{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}
#alan.pad #ekran{opacity:.6}
#ipucu{position:absolute;left:0;right:0;bottom:8px;text-align:center;color:var(--soft);font-size:12px;pointer-events:none}
#uyari{position:absolute;left:10px;right:10px;top:10px;padding:10px;border-radius:10px;background:#7f1d1dee;color:#fff;font-size:13px;text-align:center;display:none;pointer-events:none}
#imlec{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 2px #0008;pointer-events:none;display:none}
.alt{padding:8px;display:grid;gap:6px}
.sira{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.sira5{grid-template-columns:repeat(5,1fr)}
#metin{grid-column:span 3;font-size:16px;padding:10px;border-radius:10px;border:1px solid #333b46;background:var(--panel);color:var(--txt);user-select:text;-webkit-user-select:text}
#tuslar{display:none}
#tuslar.acik{display:grid}
small{color:var(--soft)}
</style>
</head>
<body>
<div id="giris"><div class="kutu">
  <h1>🖥️ Uzak Kumanda</h1>
  <p>Bilgisayar penceresinde yazan PIN'i / şifreyi gir</p>
  <input id="pin" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="32" placeholder="PIN / şifre">
  <button id="girBtn">Bağlan</button>
  <div id="hata"></div>
</div></div>

<header>
  <span id="durum"></span>
  <button class="sekme on" data-mod="ekran">📺 Ekran</button>
  <button class="sekme" data-mod="pad">🖱️ Touchpad</button>
  <button id="kaliteBtn" style="flex:none;padding:10px 12px">HD</button>
</header>

<div id="alan"><img id="ekran" alt=""><div id="imlec"></div><div id="ipucu"></div><div id="uyari"></div></div>

<div class="alt">
  <div class="sira">
    <button data-tik="left">Sol tık</button>
    <button data-tik="double">Çift tık</button>
    <button data-tik="right">Sağ tık</button>
    <button id="surukle">Basılı tut</button>
  </div>
  <div class="sira">
    <input id="metin" placeholder="Yaz ve Gönder…" autocomplete="off" enterkeyhint="send">
    <button id="gonder">Gönder</button>
  </div>
  <div class="sira">
    <button data-key="enter">Enter ⏎</button>
    <button data-key="backspace">Sil ⌫</button>
    <button data-key="esc">Esc</button>
    <button id="dahaBtn">Tuşlar ▾</button>
  </div>
  <div id="tuslar" class="alt" style="padding:0">
    <div class="sira sira5">
      <button data-key="tab">Tab</button>
      <button data-key="up">↑</button>
      <button data-key="win">⊞ Win</button>
      <button data-key="space">Boşluk</button>
      <button data-key="delete">Del</button>
    </div>
    <div class="sira sira5">
      <button data-key="left">←</button>
      <button data-key="down">↓</button>
      <button data-key="right">→</button>
      <button data-key="pageup">PgUp</button>
      <button data-key="pagedown">PgDn</button>
    </div>
    <div class="sira">
      <button data-hot="alt,tab">Alt+Tab</button>
      <button data-hot="ctrl,c">Kopyala</button>
      <button data-hot="ctrl,v">Yapıştır</button>
      <button data-hot="ctrl,z">Geri al</button>
    </div>
    <div class="sira">
      <button data-hot="alt,f4">Pencere kapat</button>
      <button data-hot="win,d">Masaüstü</button>
      <button data-key="f5">F5</button>
      <button data-key="f11">Tam ekran</button>
    </div>
    <div class="sira">
      <button data-key="volumedown">🔉</button>
      <button data-key="volumemute">🔇</button>
      <button data-key="volumeup">🔊</button>
      <button data-key="playpause">⏯</button>
    </div>
    <small>İpucu: İki parmakla kaydır = sayfa kaydırma. Uzun bas = sağ tık. Hızlı iki dokunuş = çift tık. Basılı tut açıkken dokunmak sadece fareyi götürür (sürüklemek için).</small>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
let PIN = '';
try { PIN = localStorage.getItem('uzakPin') || ''; } catch (e) {}
// bildirimdeki link şifreyi # sonrasında taşır (sunucuya gönderilmez); alıp adres çubuğundan sil
const hashK = new URLSearchParams(location.hash.slice(1)).get('k');
if (hashK) { PIN = hashK; try { localStorage.setItem('uzakPin', hashK); } catch (e) {} history.replaceState(null, '', location.pathname); }
let mod = 'ekran', hd = false, girisli = false, dongu = 0, tutuluyor = false;

function api(v, keepalive) {
  return fetch('/api', {method: 'POST', keepalive: !!keepalive, headers: {'Content-Type': 'application/json', 'X-Pin': PIN}, body: JSON.stringify(v)})
    .then(r => { if (r.status === 403) cikis(); return r; }).catch(() => {});
}

// ---- giriş ----
async function dene(p) {
  try { const r = await fetch('/check', {headers: {'X-Pin': p}}); return r.status; } catch (e) { return 0; }
}
async function gir() {
  const p = $('#pin').value.trim();
  const s = await dene(p);
  if (s === 200) { PIN = p; try { localStorage.setItem('uzakPin', p); } catch (e) {} basla(); }
  else $('#hata').textContent = s === 429 ? 'Çok fazla yanlış deneme. 1 dakika bekle.' : s === 403 ? 'PIN / şifre yanlış' : 'Bilgisayara ulaşılamıyor';
}
function cikis() { girisli = false; dongu++; birak(); $('#giris').style.display = 'flex'; }
$('#girBtn').onclick = gir;
$('#pin').onkeydown = e => { if (e.key === 'Enter') gir(); };

function basla() { $('#giris').style.display = 'none'; girisli = true; dongu++; yenile(dongu); }

// ---- ekran görüntüsü döngüsü (aynı anda tek döngü) ----
let sonUrl = null;
const bekle = ms => new Promise(r => setTimeout(r, ms));
function durum(ok, mesaj) { $('#durum').className = ok ? 'ok' : ''; $('#uyari').textContent = mesaj || ''; $('#uyari').style.display = mesaj ? 'block' : 'none'; }
async function yenile(id) {
  if (id !== dongu || !girisli || document.hidden) return;
  const w = Math.round(Math.min(screen.width * devicePixelRatio, hd ? 1920 : 1100));
  try {
    const r = await fetch(`/screen?w=${w}&q=${hd ? 70 : 45}&t=${Date.now()}`, {headers: {'X-Pin': PIN}});
    if (r.status === 403) return cikis();
    if (!r.ok) {
      durum(false, r.status === 429 ? 'Çok fazla deneme, bekleniyor…' : 'Ekran alınamıyor (bilgisayar kilitli ya da yönetici izni penceresi açık olabilir)');
      await bekle(1500);
    } else {
      const b = await r.blob();
      const u = URL.createObjectURL(b);
      $('#ekran').src = u;
      if (sonUrl) URL.revokeObjectURL(sonUrl);
      sonUrl = u;
      durum(true);
    }
  } catch (e) { durum(false, 'Bağlantı yok — bilgisayardaki siyah pencere açık mı?'); await bekle(1000); }
  setTimeout(() => yenile(id), mod === 'pad' ? 150 : 60);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) birak();
  else if (girisli) { dongu++; yenile(dongu); }
});
window.addEventListener('pagehide', birak);

$('#kaliteBtn').onclick = () => { hd = !hd; $('#kaliteBtn').classList.toggle('on', hd); };

// ---- mod ----
function modSec(m) {
  mod = m;
  document.querySelectorAll('.sekme').forEach(b => b.classList.toggle('on', b.dataset.mod === m));
  $('#alan').classList.toggle('pad', m === 'pad');
  $('#imlec').style.display = 'none';
  $('#ipucu').textContent = m === 'ekran' ? 'Dokun = tıkla · Uzun bas = sağ tık · Sürükle = fareyi götür' : 'Parmağını kaydır = fare · Dokun = tıkla · 2 parmak = kaydır';
}
document.querySelectorAll('.sekme').forEach(b => b.onclick = () => modSec(b.dataset.mod));
modSec('ekran');

// ekrandaki görüntünün gerçek kutusu (object-fit: contain); dışarısı = siyah boşluk
function oran(cx, cy) {
  const img = $('#ekran'), r = $('#alan').getBoundingClientRect();
  const iw = img.naturalWidth, ih = img.naturalHeight;
  if (!iw || !ih) return null;
  const s = Math.min(r.width / iw, r.height / ih), w = iw * s, h = ih * s;
  const ox = r.left + (r.width - w) / 2, oy = r.top + (r.height - h) / 2;
  const p = {x: (cx - ox) / w, y: (cy - oy) / h, px: cx - r.left, py: cy - r.top};
  return (p.x < 0 || p.x > 1 || p.y < 0 || p.y > 1) ? null : p;
}
function imlecGoster(p) { const c = $('#imlec'); c.style.display = 'block'; c.style.left = p.px + 'px'; c.style.top = p.py + 'px'; }

// ---- dokunma ----
const alan = $('#alan');
let bas = null, son = null, hareket = 0, uzunZ = null, ikiParmak = false, scrollY = 0, scrollBirik = 0;
let birikX = 0, birikY = 0, gonderZ = null, sonAt = 0, sonDokunma = 0, oncekiTik = null;

function hareketGonder() {
  gonderZ = null;
  const dx = Math.round(birikX), dy = Math.round(birikY);
  if (dx || dy) { api({a: 'move', dx, dy}); birikX -= dx; birikY -= dy; } // küsurat kaybolmasın
}

alan.addEventListener('touchstart', e => {
  e.preventDefault();
  if (e.touches.length >= 2) {
    ikiParmak = true; bas = null; clearTimeout(uzunZ);
    scrollY = (e.touches[0].clientY + e.touches[1].clientY) / 2; scrollBirik = 0;
    return;
  }
  if (ikiParmak) return;
  const t = e.touches[0];
  bas = son = {x: t.clientX, y: t.clientY}; hareket = 0;
  clearTimeout(uzunZ);
  uzunZ = setTimeout(() => {
    if (!bas || hareket >= 10) return;
    navigator.vibrate && navigator.vibrate(30);
    if (mod === 'ekran') { const p = oran(bas.x, bas.y); if (p) { imlecGoster(p); api({a: 'at', x: p.x, y: p.y, b: 'right'}); } }
    else api({a: 'click', b: 'right'});
    bas = null;
  }, 550);
}, {passive: false});

alan.addEventListener('touchmove', e => {
  e.preventDefault();
  if (ikiParmak) {
    if (e.touches.length < 2) return;
    const y = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    scrollBirik += y - scrollY; scrollY = y;
    const n = Math.trunc(scrollBirik / 30);
    if (n) { api({a: 'scroll', n}); scrollBirik -= n * 30; }
    return;
  }
  if (!bas || e.touches.length !== 1) return;
  const t = e.touches[0];
  const dx = t.clientX - son.x, dy = t.clientY - son.y;
  hareket += Math.abs(dx) + Math.abs(dy);
  son = {x: t.clientX, y: t.clientY};
  if (hareket > 10) clearTimeout(uzunZ);
  if (mod === 'pad') {
    const hiz = Math.hypot(dx, dy), k = 1.6 + Math.min(hiz / 8, 2.5); // hızlı kaydırınca hızlanır
    birikX += dx * k; birikY += dy * k;
    if (!gonderZ) gonderZ = setTimeout(hareketGonder, 25);
  } else if (hareket > 10) {
    const p = oran(t.clientX, t.clientY);
    if (!p) return;
    imlecGoster(p);
    const n = Date.now();
    if (n - sonAt > 40) { sonAt = n; api({a: 'at', x: p.x, y: p.y}); }
  }
}, {passive: false});

alan.addEventListener('touchend', e => {
  e.preventDefault();
  sonDokunma = Date.now();
  clearTimeout(uzunZ);
  if (ikiParmak) { if (e.touches.length === 0) ikiParmak = false; return; }
  if (!bas) return; // uzun basma zaten sağ tık yaptı
  const tik = hareket < 10;
  if (mod === 'ekran') {
    let p = oran(son.x, son.y);
    bas = null;
    if (!p) return; // siyah boşluğa dokunuldu
    // çift dokunma: ikinci dokunuşu birincinin üstüne oturt ki bilgisayar çift tık algılasın
    const n = Date.now();
    if (tik && oncekiTik && n - oncekiTik.t < 500 && Math.hypot(p.px - oncekiTik.p.px, p.py - oncekiTik.p.py) < 25) p = oncekiTik.p;
    imlecGoster(p);
    if (tik && !tutuluyor) { api({a: 'at', x: p.x, y: p.y, b: 'left'}); oncekiTik = {t: n, p}; }
    else api({a: 'at', x: p.x, y: p.y}); // basılı tutarken sadece götür
  } else {
    hareketGonder();
    if (tik && !tutuluyor) api({a: 'click', b: 'left'});
  }
  bas = null;
}, {passive: false});

// fareyle de çalışsın (bilgisayardan / dokunmatik laptoptan)
alan.addEventListener('click', e => {
  if (mod !== 'ekran' || Date.now() - sonDokunma < 800) return;
  const p = oran(e.clientX, e.clientY); if (!p) return;
  imlecGoster(p); api({a: 'at', x: p.x, y: p.y, b: 'left'});
});
alan.addEventListener('wheel', e => { e.preventDefault(); api({a: 'scroll', n: -Math.sign(e.deltaY)}); }, {passive: false});

// ---- butonlar ----
document.querySelectorAll('[data-tik]').forEach(b => b.onclick = () => api({a: 'click', b: b.dataset.tik}));
document.querySelectorAll('[data-key]').forEach(b => b.onclick = () => api({a: 'key', k: b.dataset.key}));
document.querySelectorAll('[data-hot]').forEach(b => b.onclick = () => api({a: 'hotkey', k: b.dataset.hot.split(',')}));
function birak() { if (tutuluyor) { tutuluyor = false; $('#surukle').classList.remove('on'); api({a: 'up'}, true); } }
$('#surukle').onclick = () => {
  if (tutuluyor) return birak();
  tutuluyor = true; $('#surukle').classList.add('on'); api({a: 'down'});
};
$('#dahaBtn').onclick = () => { const a = $('#tuslar').classList.toggle('acik'); $('#dahaBtn').textContent = a ? 'Tuşlar ▴' : 'Tuşlar ▾'; };
function metinGonder() { const v = $('#metin').value; if (v) { api({a: 'type', t: v}); $('#metin').value = ''; } }
$('#gonder').onclick = metinGonder;
$('#metin').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); if ($('#metin').value) metinGonder(); else api({a: 'key', k: 'enter'}); } };

// açılışta kayıtlı PIN'le otomatik bağlan
if (PIN) dene(PIN).then(s => s === 200 ? basla() : cikis()); else $('#pin').focus();
</script>
</body>
</html>
