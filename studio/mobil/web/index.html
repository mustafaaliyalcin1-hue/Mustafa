<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1117">
<title>Tepetaklak Stüdyo</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header>
  <div class="logo"><span class="kutu">▶</span><div><b>Tepetaklak</b> Stüdyo<small>çevrimdışı video kurgu</small></div></div>
</header>

<main>
  <section id="secim" class="kart">
    <label class="buyuk-dugme" for="dosya">🎬 Video seç</label>
    <input id="dosya" type="file" accept="video/*" hidden>
    <p class="ipucu">Video telefonunda işlenir, hiçbir yere yüklenmez.</p>
  </section>

  <section id="duzen" class="gizli">
    <div class="onizleme-kap"><video id="onizleme" playsinline controls></video><div id="yaziOnizleme"></div></div>

    <div class="kart">
      <h3>✂️ Kırp</h3>
      <div class="satir"><span>Başlangıç</span><input id="bas" type="range" min="0" max="100" step="0.05" value="0"><output id="basO">0.0 sn</output></div>
      <div class="satir"><span>Bitiş</span><input id="son" type="range" min="0" max="100" step="0.05" value="100"><output id="sonO">0.0 sn</output></div>
      <label class="anahtar"><input id="bosluk" type="checkbox" checked><span></span> Boşlukları otomatik kes</label>
      <div class="satir kucuk"><span>En kısa boşluk</span><input id="hassas" type="range" min="0.1" max="0.8" step="0.05" value="0.2"><output id="hassasO">0.20 sn</output></div>
    </div>

    <div class="kart">
      <h3>📐 Format</h3>
      <div class="secenekler" data-ad="format">
        <button data-d="dikey" class="sec">9:16 Reels</button><button data-d="kirp">9:16 kırp</button>
        <button data-d="kare">1:1 Kare</button><button data-d="orijinal">Orijinal</button>
      </div>
    </div>

    <div class="kart">
      <h3>🎨 Renk</h3>
      <div class="secenekler renkler" data-ad="renk">
        <button data-d="yok" class="sec">Yok</button><button data-d="sicak">Sıcak</button><button data-d="sinematik">Sinematik</button>
        <button data-d="canli">Canlı</button><button data-d="vintage">Vintage</button><button data-d="soguk">Soğuk</button>
        <button data-d="sb">Siyah-beyaz</button>
      </div>
    </div>

    <div class="kart">
      <h3>⏩ Hız</h3>
      <div class="secenekler" data-ad="hiz">
        <button data-d="0.5">0.5x</button><button data-d="1" class="sec">1x</button><button data-d="1.5">1.5x</button><button data-d="2">2x</button>
      </div>
    </div>

    <div class="kart">
      <h3>🔤 Yazı</h3>
      <input id="yazi" type="text" maxlength="40" placeholder="Başlık yaz (isteğe bağlı)">
      <div class="secenekler" data-ad="yaziYer"><button data-d="ust" class="sec">Üst</button><button data-d="orta">Orta</button><button data-d="alt">Alt</button></div>
      <div class="secenekler renk-kutulari" data-ad="yaziRenk">
        <button data-d="#FFD60A" class="sec" style="--r:#FFD60A"></button><button data-d="#FFFFFF" style="--r:#fff"></button>
        <button data-d="#00D4FF" style="--r:#00D4FF"></button><button data-d="#FF4FA3" style="--r:#FF4FA3"></button>
        <button data-d="#9BFF3A" style="--r:#9BFF3A"></button><button data-d="#FF8A1F" style="--r:#FF8A1F"></button>
      </div>
    </div>

    <div class="kart">
      <h3>🎵 Ses</h3>
      <div class="secenekler" data-ad="muzik"><button data-d="yok" class="sec">Müzik yok</button><button data-d="melodik">Melodik müzik</button></div>
      <div class="satir kucuk"><span>Müzik</span><input id="muzikSeviye" type="range" min="0" max="1" step="0.05" value="0.35"><output id="muzikO">%35</output></div>
      <div class="secenekler" data-ad="orjSes"><button data-d="1" class="sec">Ses açık</button><button data-d="0.4">Kısık</button><button data-d="0">Sessiz</button></div>
    </div>

    <div class="kart">
      <h3>⚙️ Kalite</h3>
      <div class="secenekler" data-ad="kalite"><button data-d="720" class="sec">720p (hızlı)</button><button data-d="1080">1080p</button></div>
    </div>

    <button id="olustur" class="buyuk-dugme ana">✨ Videoyu oluştur</button>
  </section>

  <section id="isleniyor" class="kart gizli">
    <h3 id="durum">Hazırlanıyor…</h3>
    <div class="cubuk"><div id="ilerleme"></div></div>
    <p class="ipucu" id="ayrinti"></p>
  </section>

  <section id="sonuc" class="gizli">
    <video id="sonucVideo" playsinline controls></video>
    <div class="dugmeler">
      <button id="kaydet" class="buyuk-dugme ana">💾 Galeriye kaydet</button>
      <button id="paylas" class="buyuk-dugme">📤 Paylaş</button>
      <button id="yeniden" class="buyuk-dugme ince">↩︎ Düzenlemeye dön</button>
    </div>
    <p class="ipucu" id="kayitBilgi"></p>
  </section>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
