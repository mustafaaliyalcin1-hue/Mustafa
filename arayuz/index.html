<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>İlerlemem</title>
  <meta name="description" content="Konuşan Arkadaşım: yıldızlar ve konular">
  <meta name="theme-color" content="#111118" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f6f6fa" media="(prefers-color-scheme: light)">
  <link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    // Tema: kayıtlı seçim, yoksa cihazın teması (ilk boyamadan önce, yanıp sönmesin)
    // Uygulamanın ☰ menüsündeki ayarlar (tema, animasyonlar) panelde de geçerli.
    try {
      var s = (JSON.parse(localStorage.getItem("konusan-baykus:v2") || "{}").settings) || {};
      var t = s.theme && s.theme !== "auto" ? s.theme : localStorage.getItem("panel:tema");
      if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.classList.add("dark");
      if (s.anim === false) document.documentElement.classList.add("no-anim");
    } catch (e) {}
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
